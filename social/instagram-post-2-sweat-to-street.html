<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>lululemon — Power Moves — IG post 2</title>
<style>
  :root{
    --white:#f7f5f2;
    --red:#c8102e;
    --gym:#1f4d4a; --gym-2:#0e2b29;
    --board:#8a3b12; --board-2:#3d1a08;
    --line: rgba(247,245,242,0.18);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{width:1080px; height:1080px; overflow:hidden; font-family:'Helvetica Neue',Arial,sans-serif; background:#0b0b0c;}
  .post{position:relative; width:1080px; height:1080px; padding:64px; display:flex; flex-direction:column;}
  .brandbar{display:flex; justify-content:space-between; align-items:center; color:var(--white);}
  .logo{font-weight:800; letter-spacing:0.18em; font-size:20px; text-transform:uppercase;}
  .campaign-tag{font-size:14px; letter-spacing:0.14em; text-transform:uppercase; opacity:0.8;}

  .headline{margin-top:46px; color:var(--white);}
  .kicker{font-size:16px; letter-spacing:0.32em; text-transform:uppercase; color:var(--red); font-weight:800; margin-bottom:18px;}
  h1{font-size:58px; font-weight:800; line-height:1.05; letter-spacing:-0.01em;}

  .transition{
    flex:1; display:flex; align-items:center; justify-content:center; gap:56px; margin-top:40px;
  }
  .look{
    flex:1; max-width:360px; text-align:center;
  }
  .look .plate{
    border:1px solid var(--line); border-radius:4px; padding:46px 30px 34px;
    display:flex; flex-direction:column; align-items:center; gap:22px; min-height:420px; justify-content:center;
  }
  .look.gym .plate{ background:linear-gradient(160deg, var(--gym) 0%, var(--gym-2) 75%, #060f0e 100%); }
  .look.street .plate{ background:linear-gradient(160deg, var(--board) 0%, var(--board-2) 75%, #150902 100%); }
  .look .time{ color:var(--white); font-size:15px; letter-spacing:0.2em; text-transform:uppercase; opacity:0.85; margin-top:18px; font-weight:700;}
  .icon{width:70px; height:70px;}
  .icon svg{width:100%; height:100%;}

  .arrow{
    display:flex; flex-direction:column; align-items:center; color:var(--white); opacity:0.85; gap:10px; flex-shrink:0;
  }
  .arrow .label{font-size:13px; letter-spacing:0.14em; text-transform:uppercase; text-align:center; max-width:110px; line-height:1.4;}

  .shared{
    margin-top:14px; font-size:13px; letter-spacing:0.08em; text-transform:uppercase; color:var(--red); font-weight:700;
  }

  .footline{
    margin-top:44px; text-align:center; color:var(--white);
  }
  .footline .sub{font-size:22px; opacity:0.9;}
  .footline .tag{margin-top:10px; font-size:15px; opacity:0.6; letter-spacing:0.1em; text-transform:uppercase;}
</style>
</head>
<body>
  <div class="post">
    <div class="brandbar">
      <div class="logo">lululemon</div>
      <div class="campaign-tag">#PowerMoves</div>
    </div>

    <div class="headline">
      <div class="kicker">Sweat To Street</div>
      <h1>Same joggers.<br>Different room.</h1>
    </div>

    <div class="transition">
      <div class="look gym">
        <div class="plate">
          <div class="icon"><svg viewBox="0 0 44 44" fill="none"><path d="M14 8l8 5 8-5v6l-4 3v20h-8V17l-4-3V8z" stroke="#f7f5f2" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
          <div class="icon"><svg viewBox="0 0 44 44" fill="none"><path d="M8 16h28l-2 8H10l-2-8z" stroke="#f7f5f2" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 24l2 12h6l1-9M34 24l-2 12h-6l-1-9" stroke="#f7f5f2" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
          <div class="icon"><svg viewBox="0 0 44 44" fill="none"><path d="M4 30c0-3 3-5 7-6l6-2 5 1 9-1c4 0 9 2 9 5v3H4v-0z" stroke="#f7f5f2" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
        </div>
        <div class="time">6AM &middot; Studio</div>
      </div>

      <div class="arrow">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none"><path d="M4 12h16M14 6l6 6-6 6" stroke="#f7f5f2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="label">No outfit<br>change</div>
      </div>

      <div class="look street">
        <div class="plate">
          <div class="icon"><svg viewBox="0 0 44 44" fill="none"><circle cx="22" cy="7" r="2.2" stroke="#f7f5f2" stroke-width="1.6"/><path d="M22 9v3M22 12l-13 7v14M22 12l13 7v14" stroke="#f7f5f2" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 19h26" stroke="#f7f5f2" stroke-width="1.6"/></svg></div>
          <div class="icon"><svg viewBox="0 0 44 44" fill="none"><path d="M8 16h28l-2 8H10l-2-8z" stroke="#f7f5f2" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 24l2 12h6l1-9M34 24l-2 12h-6l-1-9" stroke="#f7f5f2" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
          <div class="icon"><svg viewBox="0 0 44 44" fill="none"><path d="M12 30V16h6v10l6 2c3 1 4 3 4 5H12v-3z" stroke="#f7f5f2" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
        </div>
        <div class="time">9AM &middot; The Pitch</div>
      </div>
    </div>

    <div class="footline">
      <div class="sub">Blazer on top. Same fit underneath. That's the whole idea.</div>
      <div class="tag">Every power move starts before 9AM.</div>
    </div>
  </div>
</body>
</html>
